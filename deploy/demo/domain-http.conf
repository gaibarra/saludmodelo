# Dedicated Salud Modelo DEMO virtual host. Do not edit other sites.
server {
    listen 80;
    listen [::]:80;
    server_name plansaludmodelo.online;
    location ^~ /.well-known/acme-challenge/ {
        root /home/gaibarra/plandetrabajo/deploy/demo/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 503 'Salud Modelo: preparando demostración HTTPS.\n'; }
}
