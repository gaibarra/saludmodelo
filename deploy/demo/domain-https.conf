# Dedicated Salud Modelo DEMO virtual host. Do not edit other sites.
server {
    listen 80;
    listen [::]:80;
    server_name plansaludmodelo.online;
    location ^~ /.well-known/acme-challenge/ {
        root /home/gaibarra/plandetrabajo/deploy/demo/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://plansaludmodelo.online$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name plansaludmodelo.online;
    ssl_certificate /etc/letsencrypt-salud-modelo-demo/live/plansaludmodelo.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt-salud-modelo-demo/live/plansaludmodelo.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    add_header Strict-Transport-Security "max-age=3600" always;
    client_max_body_size 12m;
    location / {
        proxy_pass http://127.0.0.1:3117;
        proxy_http_version 1.1;
        proxy_set_header Host plansaludmodelo.online;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 65s;
    }
}
