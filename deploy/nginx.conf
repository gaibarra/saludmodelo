# Template: replace domain, obtain TLS certificate with Certbot before enabling.
server {
    listen 443 ssl;
    server_name salud.example.org;
    ssl_certificate /etc/letsencrypt/live/salud.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/salud.example.org/privkey.pem;
    client_max_body_size 11m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /private/ { deny all; }
}
server {
    listen 80;
    server_name salud.example.org;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://$host$request_uri; }
}
