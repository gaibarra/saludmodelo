components:
  schemas:
    AIActionEnum:
      enum:
      - report
      - contradictions
      - review
      - suggest
      - explain
      - interview
      - extract
      type: string
      description: |-
        * `report` - report
        * `contradictions` - contradictions
        * `review` - review
        * `suggest` - suggest
        * `explain` - explain
        * `interview` - interview
        * `extract` - extract
    AIDecisionInput:
      type: object
      properties:
        decision:
          $ref: '#/components/schemas/AIDecisionInputDecisionEnum'
      required:
      - decision
    AIDecisionInputDecisionEnum:
      enum:
      - cancel
      - reject
      type: string
      description: |-
        * `cancel` - cancel
        * `reject` - reject
    AIPolicyInput:
      type: object
      properties:
        actions:
          type: array
          items:
            $ref: '#/components/schemas/AIActionEnum'
          maxItems: 7
        version:
          type: integer
          minimum: 0
        enabled:
          type: boolean
        providers:
          type: array
          items:
            $ref: '#/components/schemas/AIProviderEnum'
          maxItems: 2
        monthly_user_calls:
          type: integer
          maximum: 10000
          minimum: 0
        monthly_calls:
          type: integer
          maximum: 10000
          minimum: 0
        monthly_tokens:
          type: integer
          maximum: 100000000
          minimum: 0
        monthly_cost_limit:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,6})?$
        rationale:
          type: string
          maxLength: 5000
      required:
      - enabled
      - monthly_calls
      - monthly_cost_limit
      - monthly_tokens
      - monthly_user_calls
      - providers
      - rationale
      - version
    AIProviderEnum:
      enum:
      - openai
      - deepseek
      type: string
      description: |-
        * `openai` - openai
        * `deepseek` - deepseek
    AIReleaseInput:
      type: object
      properties:
        fragment_ids:
          type: array
          items:
            type: integer
            minimum: 1
          maxItems: 8
          minItems: 1
        provider:
          $ref: '#/components/schemas/AIProviderEnum'
        classification:
          $ref: '#/components/schemas/ClassificationEnum'
        expires:
          type: string
          format: date
        rationale:
          type: string
          maxLength: 5000
      required:
      - classification
      - expires
      - fragment_ids
      - provider
      - rationale
    AIRequestInput:
      type: object
      properties:
        answer_release_id:
          type: integer
          minimum: 1
        confirm_answer_send:
          type: boolean
          default: false
        action:
          allOf:
          - $ref: '#/components/schemas/AIActionEnum'
          default: suggest
        provider:
          $ref: '#/components/schemas/AIProviderEnum'
        fragment_ids:
          type: array
          items:
            type: integer
            minimum: 1
          maxItems: 8
          minItems: 0
        version:
          type: integer
          minimum: 0
        client_key:
          type: string
          format: uuid
      required:
      - client_key
      - fragment_ids
      - provider
      - version
    AllocationInput:
      type: object
      properties:
        service:
          type: integer
          minimum: 1
        minutes:
          type: integer
          maximum: 1440
          minimum: 1
      required:
      - minutes
      - service
    Answer:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        upload_formats:
          type: array
          items:
            type: string
          readOnly: true
        questionnaire:
          type: integer
        can_ai:
          type: boolean
          readOnly: true
        can_consult:
          type: boolean
          readOnly: true
        version:
          type: integer
          maximum: 2147483647
          minimum: 0
        etag:
          type: integer
          maximum: 2147483647
          minimum: 0
        state:
          type: string
          maxLength: 30
        original:
          type: string
        source:
          type: string
        question_version:
          type: integer
        service:
          type: integer
        help: {}
        revisions:
          type: array
          items:
            type: object
            additionalProperties: {}
          readOnly: true
        evidence:
          type: array
          items:
            type: object
            additionalProperties: {}
          readOnly: true
      required:
      - can_ai
      - can_consult
      - evidence
      - help
      - id
      - original
      - question_version
      - questionnaire
      - revisions
      - service
      - source
      - upload_formats
    AnswerReleaseInput:
      type: object
      properties:
        purpose:
          allOf:
          - $ref: '#/components/schemas/PurposeEnum'
          default: review
        version:
          type: integer
          minimum: 0
        provider:
          $ref: '#/components/schemas/AIProviderEnum'
        classification:
          $ref: '#/components/schemas/ClassificationEnum'
        expires:
          type: string
          format: date
        rationale:
          type: string
          maxLength: 5000
        checked:
          type: boolean
      required:
      - checked
      - classification
      - expires
      - provider
      - rationale
      - version
    ApplicabilityEnum:
      enum:
      - pending
      - applies
      - not_applies
      type: string
      description: |-
        * `pending` - pending
        * `applies` - applies
        * `not_applies` - not_applies
    Assignment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
        username:
          type: string
        service:
          type: integer
        role:
          $ref: '#/components/schemas/RoleEnum'
        starts:
          type: string
          format: date
        ends:
          type: string
          format: date
        approved_by_name:
          type: string
        rationale:
          type: string
        revoked_at:
          type: string
          format: date-time
          nullable: true
        revocation_reason:
          type: string
        substitutes:
          type: integer
          nullable: true
      required:
      - approved_by_name
      - ends
      - id
      - role
      - service
      - starts
      - user
      - username
    AssignmentInput:
      type: object
      properties:
        substitutes:
          type: integer
          minimum: 1
          nullable: true
        user:
          type: integer
          minimum: 1
        service:
          type: integer
          minimum: 1
        role:
